name: huezumi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huezumi}
      POSTGRES_USER: ${POSTGRES_USER:-huezumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - huezumi-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-huezumi} -d ${POSTGRES_DB:-huezumi}
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.port=9000
      - -admin.port=9001
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_OSS_ACCESS_KEY_ID:?set LOCAL_OSS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_OSS_ACCESS_KEY_SECRET:?set LOCAL_OSS_ACCESS_KEY_SECRET in .env}
      S3_BUCKET: ${LOCAL_OSS_BUCKET:-huezumi}
      WEED_ADMIN_USER: ${LOCAL_OSS_ACCESS_KEY_ID:?set LOCAL_OSS_ACCESS_KEY_ID in .env}
      WEED_ADMIN_PASSWORD: ${LOCAL_OSS_ACCESS_KEY_SECRET:?set LOCAL_OSS_ACCESS_KEY_SECRET in .env}
    ports:
      - '127.0.0.1:${LOCAL_OSS_API_PORT:-9100}:9000'
      - '127.0.0.1:${LOCAL_OSS_CONSOLE_PORT:-9101}:9001'
    volumes:
      - huezumi-seaweedfs-dev:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  huezumi-postgres-dev:
    name: huezumi-postgres-dev
  huezumi-seaweedfs-dev:
    name: huezumi-seaweedfs-dev
