name: huezumi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huezumi}
      POSTGRES_USER: ${POSTGRES_USER:-huezumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-huezumi} -d ${POSTGRES_DB:-huezumi}']
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build: .
    environment: &app-env
      NUXT_CONNECTION_ENCRYPTION_KEY: ${NUXT_CONNECTION_ENCRYPTION_KEY:?set NUXT_CONNECTION_ENCRYPTION_KEY}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:?set NUXT_PUBLIC_APP_URL}
      NUXT_OSS_ACCESS_KEY_ID: ${NUXT_OSS_ACCESS_KEY_ID:?set NUXT_OSS_ACCESS_KEY_ID}
      NUXT_OSS_ACCESS_KEY_SECRET: ${NUXT_OSS_ACCESS_KEY_SECRET:?set NUXT_OSS_ACCESS_KEY_SECRET}
      NUXT_OSS_BUCKET: ${NUXT_OSS_BUCKET:?set NUXT_OSS_BUCKET}
      NUXT_OSS_REGION: ${NUXT_OSS_REGION:-cn-beijing}
      NUXT_OSS_ENDPOINT: ${NUXT_OSS_ENDPOINT:-}
      NUXT_OSS_SECURE: ${NUXT_OSS_SECURE:-true}
      NUXT_OSS_PUBLIC_BASE_URL: ${NUXT_OSS_PUBLIC_BASE_URL:-}
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER:-huezumi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huezumi}
      NUXT_COMFYUI_MODE: remote
      NUXT_COMFYUI_REMOTE_BASE_URL: http://comfyui:8188
    command: [pnpm, 'db:init']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      <<: *app-env
      NUXT_WORKER_ENABLED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      db-init:
        condition: service_completed_successfully

  worker:
    build: .
    environment:
      <<: *app-env
      NUXT_WORKER_ENABLED: 'true'
      NUXT_WORKER_CONCURRENCY: ${NUXT_WORKER_CONCURRENCY:-4}
    depends_on:
      db-init:
        condition: service_completed_successfully

  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile
      args:
        COMFYUI_REF: ${COMFYUI_REF:-v0.37.0}
    gpus: all
    volumes:
      - ${COMFYUI_MODELS_DIR:?set COMFYUI_MODELS_DIR}:/opt/ComfyUI/models:ro
      - comfy-input:/opt/ComfyUI/input
      - comfy-output:/opt/ComfyUI/output
      - comfy-temp:/opt/ComfyUI/temp
    expose:
      - '8188'

volumes:
  postgres-data:
  comfy-input:
  comfy-output:
  comfy-temp:
